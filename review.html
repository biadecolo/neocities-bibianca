<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>review – webcantinho da bia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/porquinho.png">
    <style>
        .back-link {
            display: inline-block;
            font-size: 0.8rem;
            color: #2d5a27;
            text-decoration: none;
            font-style: italic;
            margin-bottom: 20px;
        }
        .back-link:hover { color: #1a3a16; }

        .book-header {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eef1ea;
        }

        .book-cover {
            width: 100px;
            height: 145px;
            object-fit: cover;
            border-radius: 5px;
            box-shadow: 4px 5px 14px rgba(0,0,0,0.18);
            flex-shrink: 0;
        }

        .book-cover-placeholder {
            width: 100px;
            height: 145px;
            border-radius: 5px;
            background: #eef1ea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 4px 5px 14px rgba(0,0,0,0.12);
            flex-shrink: 0;
        }

        .book-meta {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
        }

        .book-date {
            font-size: 0.75rem;
            color: #999;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.25;
            margin: 0;
        }

        .book-author {
            font-size: 0.85rem;
            color: #777;
            font-style: italic;
        }

        .book-rating {
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .state-msg {
            font-size: 0.9rem;
            color: #999;
            text-align: center;
            padding: 30px 0;
        }
    </style>
</head>
<body>
    <div class="background-overlay">
        <div class="main-window">

            <aside class="sidebar">
                <div class="intro-text">
                    <img src="https://t4.ftcdn.net/jpg/09/81/07/07/360_F_981070762_NMItKcLbDZJwNrp4PQ60tDkq6EgnZqwS.jpg" class="maxwid">
                    <p>eiiii, eu sou a <strong>bia</strong> e esse é meu cantinho na internet. se passar por aqui, <mark><a href="https://www.yourworldoftext.com/~bibia/" target="_blank">assina o meu guestbook</a></mark> pra eu saber hehe <img src="assets/porquinho.png" class="emoji-img"></p>
                </div>
                <nav class="menu">
                    <a href="index.html" class="menu-item">
                        <img src="assets/icon-gift.png" class="menu-icon"> começo
                    </a>
                    <a href="leitura.html" class="menu-item active">
                        <img src="assets/icon-book.png" class="menu-icon"> leitura
                    </a>
                    <a href="#" class="menu-item">
                        <img src="assets/icon-cat.png" class="menu-icon"> coisas foda
                    </a>
                    <a href="#" class="menu-item">
                        <img src="assets/icon-mail.png" class="menu-icon"> fala comigo
                    </a>
                </nav>
                <div class="pixel-plants">
                    <img src="assets/plantinhas.png" alt="minhas plantinhas">
                </div>
            </aside>

            <section class="content-area">
                <div class="content-box" id="main-content">
                    <a class="back-link" href="leitura.html" data-i18n-en="← back to reading">← voltar pra leitura</a>
                    <p class="state-msg" id="loading-msg" data-i18n-en="loading review...">carregando review...</p>
                </div>

                <div class="side-pixel-art">
                    <img src="assets/gatoshiu.png" alt="gato pixel art">
                </div>
            </section>

        </div>

        <footer class="footer-bar">
            <div class="slider-track" id="track">
                <img src="assets/banner (1).png">
                <img src="assets/banner (2).png">
                <img src="assets/banner (3).png">
                <img src="assets/banner (4).png">
                <img src="assets/banner (5).png">
                <img src="assets/banner (6).png">
                <img src="assets/banner (7).png">
                <img src="assets/banner (8).png">
            </div>
        </footer>

        <small class="mobile-notice"><span data-i18n-en="this site looks kinda rough on mobile. sorry! 🌻">esse site fica meio paia no mobile. me desculpa! 🌻</span></small>
    </div>

    <script src="script.js"></script>
    <script>
        const WORKER_URL = 'https://bibianca-neocities.biancadecolo.workers.dev';

        function formatDate(str) {
            if (!str) return '';
            const d = new Date(str + 'T00:00:00');
            return d.toLocaleDateString(getLang() === 'en' ? 'en-US' : 'pt-BR', { month: 'long', year: 'numeric' });
        }

        function renderStars(nota) {
            if (!nota) return '';
            const full = Math.floor(nota);
            const half = (nota % 1) >= 0.5;
            return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - Math.ceil(nota));
        }

        function textToHtml(text) {
            if (!text) return '';
            return text
                .split(/\n\n+/)
                .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        async function loadReview() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const main = document.getElementById('main-content');
            const loadingMsg = document.getElementById('loading-msg');

            if (!id) {
                loadingMsg.textContent = getLang() === 'en' ? 'book not found 😿' : 'livro não encontrado 😿';
                return;
            }

            try {
                const res = await fetch(`${WORKER_URL}?table=livros&id=${id}`);
                if (!res.ok) throw new Error();
                const [book] = await res.json();

                if (!book) {
                    loadingMsg.textContent = getLang() === 'en' ? "this book doesn't exist... 🤔" : 'esse livro não existe... 🤔';
                    return;
                }

                document.title = `${book.titulo} – webcantinho da bia`;

                main.innerHTML = `
                    <a class="back-link" href="leitura.html">← voltar pra leitura</a>

                    <div class="book-header">
                        ${book.capa_url
                            ? `<img class="book-cover" src="${book.capa_url}" alt="capa de ${book.titulo}">`
                            : `<div class="book-cover-placeholder">📖</div>`
                        }
                        <div class="book-meta">
                            <span class="book-date">${formatDate(book.data)}</span>
                            <h1 class="book-title">${book.titulo}</h1>
                            ${book.autor ? `<span class="book-author">${book.autor}</span>` : ''}
                            ${book.nota ? `<div class="book-rating">${renderStars(book.nota)}</div>` : ''}
                        </div>
                    </div>

                    <div class="review-body">
                        ${textToHtml(book.review)}
                    </div>
                `;

            } catch (err) {
                document.getElementById('loading-msg').textContent = getLang() === 'en'
                    ? "oops, couldn't load this review 😿"
                    : 'ops, não consegui carregar essa review 😿';
            }
        }

        loadReview();
    </script>
</body>
</html>
